<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Mount Fuel</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:white;
    width:400px;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    margin-bottom:15px;
    color:#0d1b2a;
}

p{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

.input-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    background:#ffb703;
    border:none;
    border-radius:5px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.back{
    text-align:center;
    margin-top:15px;
}

.back a{
    text-decoration:none;
    color:#0d1b2a;
    font-weight:bold;
}

.success{
    margin-top:15px;
    color:green;
    text-align:center;
    display:none;
}
</style>
</head>
<body>

<div class="container">

    <h2>Forgot Password</h2>

    <p>
        Enter your email address and we will send
        a password reset link.
    </p>

    <form id="resetForm">

        <div class="input-group">
            <label>Email Address</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>
        </div>

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <div class="success" id="successMessage">
        Password reset link has been sent successfully!
    </div>

    <div class="back">
        <a href="loginform of mountfuel.html">← Back to Login</a>
    </div>

</div>

<script>
document.getElementById("resetForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    document.getElementById("successMessage")
    .style.display = "block";

});
</script>

</body>
</html>
